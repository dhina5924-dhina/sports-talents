# Server Configuration
server.port=8080

# Application Name
spring.application.name=sports-platform

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:sportsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring SQL Script Initialization
spring.sql.init.mode=always

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Custom File Storage Configuration
app.upload.dir=uploads/
app.jwt.secret=9a2f8c4e7b1d3f6a9c8e7b1d3f6a9c8e7b1d3f6a9c8e7b1d3f6a9c8e7b1d3f6a
app.jwt.expiration-ms=86400000
